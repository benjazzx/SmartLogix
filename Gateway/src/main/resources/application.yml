# Las rutas del Gateway se definen en Java, en
# Gateway/config/GatewayRouteConfig.java, no aca. En
# spring-cloud-gateway-server-webmvc 5.0.1 los placeholders ${...} dentro del
# "uri:" de una lista de rutas YAML no se resuelven contra variables de
# entorno (a diferencia de una property simple como jwt.secret, que si
# funciona), asi que se movieron a Java con @Value.
spring:
  application:
    name: Gateway

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 15s
    instances:
      usersCircuitBreaker:
        baseConfig: default
      rolCircuitBreaker:
        baseConfig: default
      estadoCircuitBreaker:
        baseConfig: default
      inventarioCircuitBreaker:
        baseConfig: default
      ordenCircuitBreaker:
        baseConfig: default
      productoCircuitBreaker:
        baseConfig: default
      configuracionCircuitBreaker:
        baseConfig: default
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        waitDurationInOpenState: 10s
        failureRateThreshold: 60
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      usersCircuitBreaker:
        baseConfig: default
      rolCircuitBreaker:
        baseConfig: default
      estadoCircuitBreaker:
        baseConfig: default
      inventarioCircuitBreaker:
        baseConfig: default
      ordenCircuitBreaker:
        baseConfig: default
      productoCircuitBreaker:
        baseConfig: default
      configuracionCircuitBreaker:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    gateway:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    Gateway.example: INFO
