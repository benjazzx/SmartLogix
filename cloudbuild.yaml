# cloudbuild.yaml — build paralelo + push a Docker Hub + rollout restart en GKE
#
# Requiere en Secret Manager (proyecto river-dynamo-502903-m6):
#   DOCKER_USERNAME, DOCKER_PASSWORD
# y que la cuenta de servicio de Cloud Build tenga los roles:
#   roles/secretmanager.secretAccessor
#   roles/container.developer  (para el kubectl rollout restart)

substitutions:
  _CLUSTER: smart-login-web
  _ZONE: us-central1-a
  _PROJECT: river-dynamo-502903-m6
  _NAMESPACE: smartlogix
  _REGISTRY: contenedorbenjaxio/smartlogix

availableSecrets:
  secretManager:
    - versionName: projects/${_PROJECT}/secrets/DOCKER_USERNAME/versions/latest
      env: DOCKER_USERNAME
    - versionName: projects/${_PROJECT}/secrets/DOCKER_PASSWORD/versions/latest
      env: DOCKER_PASSWORD

steps:

  # -------------------------------------------------------
  # LOGIN A DOCKER HUB
  # -------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: docker-login
    entrypoint: bash
    args:
      - -c
      - echo $$DOCKER_PASSWORD | docker login -u $$DOCKER_USERNAME --password-stdin
    secretEnv: [DOCKER_USERNAME, DOCKER_PASSWORD]

  # -------------------------------------------------------
  # BUILD EN PARALELO — todos los servicios a la vez
  # Carpetas reales del repo: Gateway, Users, Rol, Estado, Inventario,
  # Producto, Orden, Configuracion (sin sufijo "-service", con mayuscula).
  # -------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: build-gateway
    waitFor: [docker-login]
    args: [build, -t, '${_REGISTRY}:gateway', -t, '${_REGISTRY}:gateway-${SHORT_SHA}', ./Gateway]

  - name: gcr.io/cloud-builders/docker
    id: build-users
    waitFor: [docker-login]
    args: [build, -t, '${_REGISTRY}:users', -t, '${_REGISTRY}:users-${SHORT_SHA}', ./Users]

  - name: gcr.io/cloud-builders/docker
    id: build-rol
    waitFor: [docker-login]
    args: [build, -t, '${_REGISTRY}:rol', -t, '${_REGISTRY}:rol-${SHORT_SHA}', ./Rol]

  - name: gcr.io/cloud-builders/docker
    id: build-estado
    waitFor: [docker-login]
    args: [build, -t, '${_REGISTRY}:estado', -t, '${_REGISTRY}:estado-${SHORT_SHA}', ./Estado]

  - name: gcr.io/cloud-builders/docker
    id: build-inventario
    waitFor: [docker-login]
    args: [build, -t, '${_REGISTRY}:inventario', -t, '${_REGISTRY}:inventario-${SHORT_SHA}', ./Inventario]

  - name: gcr.io/cloud-builders/docker
    id: build-producto
    waitFor: [docker-login]
    args: [build, -t, '${_REGISTRY}:producto', -t, '${_REGISTRY}:producto-${SHORT_SHA}', ./Producto]

  - name: gcr.io/cloud-builders/docker
    id: build-orden
    waitFor: [docker-login]
    args: [build, -t, '${_REGISTRY}:orden', -t, '${_REGISTRY}:orden-${SHORT_SHA}', ./Orden]

  - name: gcr.io/cloud-builders/docker
    id: build-configuracion
    waitFor: [docker-login]
    args: [build, -t, '${_REGISTRY}:configuracion', -t, '${_REGISTRY}:configuracion-${SHORT_SHA}', ./Configuracion]

  # -------------------------------------------------------
  # PUSH EN PARALELO
  # NOTA: "docker push --all-tags <repo>:tag" no es valido (--all-tags no
  # acepta un tag especifico) y ademas empujaria los tags de TODOS los
  # servicios ya construidos en este build (comparten el mismo nombre de
  # repo). Se empuja cada tag explicito para que cada step solo suba lo
  # que le corresponde a su propio servicio.
  # -------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: push-gateway
    waitFor: [build-gateway]
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_REGISTRY}:gateway
        docker push ${_REGISTRY}:gateway-${SHORT_SHA}

  - name: gcr.io/cloud-builders/docker
    id: push-users
    waitFor: [build-users]
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_REGISTRY}:users
        docker push ${_REGISTRY}:users-${SHORT_SHA}

  - name: gcr.io/cloud-builders/docker
    id: push-rol
    waitFor: [build-rol]
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_REGISTRY}:rol
        docker push ${_REGISTRY}:rol-${SHORT_SHA}

  - name: gcr.io/cloud-builders/docker
    id: push-estado
    waitFor: [build-estado]
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_REGISTRY}:estado
        docker push ${_REGISTRY}:estado-${SHORT_SHA}

  - name: gcr.io/cloud-builders/docker
    id: push-inventario
    waitFor: [build-inventario]
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_REGISTRY}:inventario
        docker push ${_REGISTRY}:inventario-${SHORT_SHA}

  - name: gcr.io/cloud-builders/docker
    id: push-producto
    waitFor: [build-producto]
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_REGISTRY}:producto
        docker push ${_REGISTRY}:producto-${SHORT_SHA}

  - name: gcr.io/cloud-builders/docker
    id: push-orden
    waitFor: [build-orden]
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_REGISTRY}:orden
        docker push ${_REGISTRY}:orden-${SHORT_SHA}

  - name: gcr.io/cloud-builders/docker
    id: push-configuracion
    waitFor: [build-configuracion]
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_REGISTRY}:configuracion
        docker push ${_REGISTRY}:configuracion-${SHORT_SHA}

  # -------------------------------------------------------
  # DEPLOY A GKE — rollout restart de todos los servicios
  # Espera a que todos los push terminen
  # -------------------------------------------------------
  - name: gcr.io/cloud-builders/kubectl
    id: deploy
    waitFor:
      - push-gateway
      - push-users
      - push-rol
      - push-estado
      - push-inventario
      - push-producto
      - push-orden
      - push-configuracion
    entrypoint: bash
    args:
      - -c
      - |
        kubectl rollout restart deployment/gateway               -n ${_NAMESPACE}
        kubectl rollout restart deployment/users-service         -n ${_NAMESPACE}
        kubectl rollout restart deployment/rol-service            -n ${_NAMESPACE}
        kubectl rollout restart deployment/estado-service         -n ${_NAMESPACE}
        kubectl rollout restart deployment/inventario-service     -n ${_NAMESPACE}
        kubectl rollout restart deployment/producto-service       -n ${_NAMESPACE}
        kubectl rollout restart deployment/orden-service           -n ${_NAMESPACE}
        kubectl rollout restart deployment/configuracion-service  -n ${_NAMESPACE}
    env:
      - CLOUDSDK_COMPUTE_ZONE=${_ZONE}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}
      - CLOUDSDK_CORE_PROJECT=${_PROJECT}

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s

# ── Trigger (push a main) ───────────────────────────────────────────────────
# No va dentro de este archivo — se registra una sola vez como recurso aparte:
#
# gcloud builds triggers create github \
#   --project=river-dynamo-502903-m6 \
#   --name=smartlogix-main-push \
#   --repo-owner=<tu-usuario-github> \
#   --repo-name=<tu-repo> \
#   --branch-pattern="^main$" \
#   --build-config=cloudbuild.yaml
