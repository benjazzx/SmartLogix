spring.application.name=Orden
server.port=8084
spring.main.web-application-type=servlet

spring.datasource.url=jdbc:postgresql://localhost:5432/Orden
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.maximum-pool-size=3

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Kafka - Orden solo produce eventos (StreamBridge no requiere bindings declarados)
spring.cloud.stream.kafka.binder.brokers=localhost:9092

# URLs de otros microservicios
users.service.url=${USERS_SERVICE_URL:http://localhost:8082}
estado.service.url=${ESTADO_SERVICE_URL:http://localhost:8086}
producto.service.url=${PRODUCTO_SERVICE_URL:http://localhost:8085}
internal.service.key=${INTERNAL_SERVICE_KEY:}

# TimeLimiter — sin esto, Resilience4j usa el default de la libreria (1s), demasiado
# agresivo para llamadas HTTP reales entre microservicios bajo carga del host.
resilience4j.timelimiter.instances.usersClient.timeout-duration=5s
resilience4j.timelimiter.instances.usersClientDir.timeout-duration=5s
resilience4j.timelimiter.instances.productoClient.timeout-duration=5s
resilience4j.timelimiter.instances.estadoClient.timeout-duration=5s

# Circuit Breaker — nombres alineados con circuitBreakerFactory.create("...") en cada client
resilience4j.circuitbreaker.instances.usersClient.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.usersClient.slidingWindowSize=10
resilience4j.circuitbreaker.instances.usersClient.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.usersClient.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.usersClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productoClient.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.productoClient.slidingWindowSize=10
resilience4j.circuitbreaker.instances.productoClient.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.productoClient.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.productoClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.estadoClient.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.estadoClient.slidingWindowSize=10
resilience4j.circuitbreaker.instances.estadoClient.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.estadoClient.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.estadoClient.failureRateThreshold=50

# JWT — misma clave que Users para validar tokens generados alli
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# Metricas Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:smartlogix}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:changeme-rabbitmq}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false

rabbitmq.logistica.exchange=logistica-exchange
rabbitmq.logistica.dlx=logistica-dlx

# Productor: orden.creada (lo consume Inventario)
rabbitmq.logistica.orden-creada.routing-key=orden.creada

# Consumidor: orden.bodega-asignada (respuesta de Inventario)
rabbitmq.logistica.orden-bodega-asignada.queue=orden-bodega-asignada-queue
rabbitmq.logistica.orden-bodega-asignada.routing-key=orden.bodega-asignada
rabbitmq.logistica.orden-bodega-asignada.dlq=orden-bodega-asignada-dlq
rabbitmq.logistica.orden-bodega-asignada.dlq-routing-key=orden.bodega-asignada.dlq
