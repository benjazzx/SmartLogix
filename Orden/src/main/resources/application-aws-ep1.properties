# Perfil activo solo en el despliegue EC2 de la EP1/EP2 DSY1107 (Pedidos360 en AWS).
# Sobreescribe la base de datos: Oracle Autonomous DB en vez de Postgres.
# Las credenciales llegan como variables de entorno leidas desde AWS Secrets Manager
# por el entrypoint del contenedor (ver docker-compose.ec2.yml), no estan en texto plano aca.

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
