# Perfil usado solo por los integration tests (@SpringBootTest). Levanta el contexto
# completo de Spring con una base H2 en memoria en vez del Postgres real, para que
# los tests corran sin depender de Docker ni de los demas microservicios.
spring.datasource.url=jdbc:h2:mem:orden_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

internal.service.key=test-internal-key
jwt.secret=test-secret-solo-para-integration-tests-no-usar-en-produccion
jwt.expiration=86400000

users.service.url=http://localhost:8082
estado.service.url=http://localhost:8086
producto.service.url=http://localhost:8085
