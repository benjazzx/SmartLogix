spring.application.name=Producto
server.port=8085
spring.main.web-application-type=servlet

# ── Base de datos ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/Producto
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.maximum-pool-size=3

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Kafka — Producto publica eventos (StreamBridge, no necesita function.definition) ──
spring.cloud.stream.kafka.binder.brokers=localhost:9092

# ── URLs de otros microservicios ──────────────────────────────────────────────
inventario.service.url=${INVENTARIO_SERVICE_URL:http://localhost:8083}

# ── Circuit Breaker (Resilience4j) — InventarioClient fail-closed ─────────────
resilience4j.circuitbreaker.instances.inventarioClient.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.inventarioClient.slidingWindowSize=10
resilience4j.circuitbreaker.instances.inventarioClient.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.inventarioClient.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.inventarioClient.failureRateThreshold=50
resilience4j.timelimiter.instances.inventarioClient.timeoutDuration=3s

# ── JWT — misma clave que Users para validar tokens generados allí ─────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── Clave compartida para llamadas internas Inventario → Producto ──────────────
internal.service.key=${INTERNAL_SERVICE_KEY:changeme-internal-key}

# ── Springdoc / OpenAPI ───────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ── Fotos ─────────────────────────────────────────────────────────────────────
foto.storage.path=${FOTO_STORAGE_PATH:/app/fotos}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.Producto.example=INFO
