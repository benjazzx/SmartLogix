spring.application.name=Configuracion
server.port=8087

# ── Base de datos ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/Configuracion
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.maximum-pool-size=3

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── JWT — misma clave que Users para validar tokens generados allí ─────────────
jwt.secret=${JWT_SECRET}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.Configuracion.example=INFO

# Metricas Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true

# ── RabbitMQ — Configuracion consume usuario.registrado (publicado por Users) ─────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:smartlogix}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:changeme-rabbitmq}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# La mensajería es una tarea secundaria: si RabbitMQ no está disponible, Configuracion sigue
# sirviendo preferencias. Sin esto, /actuator/health (probes de k8s y compose) caería a DOWN.
management.health.rabbit.enabled=false

rabbitmq.usuarios.exchange=usuarios-exchange
rabbitmq.usuarios.dlx=usuarios-dlx
rabbitmq.usuarios.registrado.queue=configuracion-usuario-registrado-queue
rabbitmq.usuarios.registrado.routing-key=usuario.registrado
rabbitmq.usuarios.registrado.dlq=configuracion-usuario-registrado-dlq
rabbitmq.usuarios.registrado.dlq-routing-key=usuario.registrado.dlq
