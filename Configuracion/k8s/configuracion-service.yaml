apiVersion: apps/v1
kind: Deployment
metadata:
  name: configuracion-service
  namespace: smartlogix
  labels:
    app: configuracion-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configuracion-service
  template:
    metadata:
      labels:
        app: configuracion-service
    spec:
      containers:
        - name: configuracion-service
          image: contenedorbenjaxio/smartlogix:configuracion
          ports:
            - containerPort: 8087
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/Configuracion
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartlogix-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartlogix-secrets
                  key: jwt-secret
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx300m"
          resources:
            requests:
              cpu: 200m
              memory: 320Mi
            limits:
              cpu: 500m
              memory: 480Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: configuracion-service
  namespace: smartlogix
spec:
  type: ClusterIP
  selector:
    app: configuracion-service
  ports:
    - port: 8087
      targetPort: 8087
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: configuracion-service-hpa
  namespace: smartlogix
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: configuracion-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
