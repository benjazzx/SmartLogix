# Plantilla de referencia — NO aplicar tal cual (no lleva valores reales).
#
# Crea el secret real con kubectl, sin dejar los valores escritos en un archivo
# versionado en git:
#
#   kubectl create secret generic smartlogix-secrets \
#     --namespace smartlogix \
#     --from-literal=jwt-secret="<JWT_SECRET>" \
#     --from-literal=db-password="<SPRING_DATASOURCE_PASSWORD>" \
#     --from-literal=internal-service-key="<INTERNAL_SERVICE_KEY>"
#
# Claves usadas por el resto de los manifiestos:
#   jwt-secret            -> JWT_SECRET (todos los microservicios + gateway)
#   db-password            -> SPRING_DATASOURCE_PASSWORD y POSTGRES_PASSWORD
#   internal-service-key   -> INTERNAL_SERVICE_KEY (inventario-service, producto-service)
apiVersion: v1
kind: Secret
metadata:
  name: smartlogix-secrets
  namespace: smartlogix
type: Opaque
stringData:
  jwt-secret: "<JWT_SECRET>"
  db-password: "<SPRING_DATASOURCE_PASSWORD>"
  internal-service-key: "<INTERNAL_SERVICE_KEY>"
