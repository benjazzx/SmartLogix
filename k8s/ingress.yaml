apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartlogix-ingress
  namespace: smartlogix
  annotations:
    # --- Timeouts ---
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
 
    # --- HTTPS forzado ---
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
 
    # --- TLS/cert-manager ---
    cert-manager.io/cluster-issuer: letsencrypt-prod
 
    # --- Security Headers ---
    # HSTS: fuerza HTTPS por 1 año, incluye subdominios
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
 
    # Evita que el sitio sea embebido en iframes (clickjacking)
    nginx.ingress.kubernetes.io/custom-headers: |
      X-Frame-Options: SAMEORIGIN
      X-Content-Type-Options: nosniff
      X-XSS-Protection: 1; mode=block
      Referrer-Policy: strict-origin-when-cross-origin
 
    # --- Rate Limiting (anti fuerza bruta) ---
    # Máximo 20 requests por segundo por IP
    nginx.ingress.kubernetes.io/limit-rps: "20"
    # Máximo 200 conexiones simultáneas por IP
    nginx.ingress.kubernetes.io/limit-connections: "200"
 
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - 34.42.32.173.nip.io
      secretName: smartlogix-tls
  rules:
    - host: 34.42.32.173.nip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 4200